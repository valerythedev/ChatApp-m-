# Render Blueprint — repo root (monorepo). Service code lives in chat-backend/.
services:
  - type: web
    name: chat-backend
    runtime: node
    rootDir: chat-backend
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-postgres
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false

databases:
  - name: chat-postgres
    plan: free
    databaseName: chatdb
    user: chatuser
