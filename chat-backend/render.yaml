services:
  - type: web
    name: chat-backend
    runtime: node
    # When using the repo-root render.yaml Blueprint, rootDir is set there.
    # If this file is the only Blueprint, set Root Directory to chat-backend in the Render dashboard.
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-postgres
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: FRONTEND_URL
        sync: false

databases:
  - name: chat-postgres
    plan: free
    databaseName: chatdb
    user: chatuser
